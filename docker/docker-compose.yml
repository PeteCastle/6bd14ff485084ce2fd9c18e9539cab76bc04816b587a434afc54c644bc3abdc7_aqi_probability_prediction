---
x-airflow-common:
  &airflow-common
  build:
    context: ${PWD}          # project root
    dockerfile: docker/airflow.Dockerfile
  env_file: ${PWD}/config/.env
  volumes:
    - ${PWD}/airflow/logs:/opt/airflow/logs
    - ${PWD}/models:/opt/airflow/models
    - ${PWD}/cache:/opt/airflow/cache
    - ${PWD}/airflow/dags:/opt/airflow/dags
    - ${PWD}/src:/opt/airflow/src
    - ${PWD}/reports:/opt/airflow/reports
    - ${PWD}/config/airflow.cfg:/opt/airflow/airflow.cfg
    - ${PWD}/data:/opt/airflow/data
    - ${PWD}/mlflow:/mlflow


  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    - redis
    - postgres
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 3
      start_period: 5s

  mlflow:
    build:
      context: ${PWD}
      dockerfile: docker/Dockerfile.mlflow
    ports:
      - "5000:5000"
    env_file: ${PWD}/config/.env
    depends_on:
      postgres:
        condition: service_healthy
      optuna-init:
        condition: service_completed_successfully
    volumes:
      # - mlflow-artifacts:/mlflow/artifacts
      - ${PWD}/mlflow:/mlflow

  optuna-init:
    image: postgres:13
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${PWD}/scripts/init-optuna-db.sh:/init-optuna-db.sh
      - ${PWD}/scripts/init-mlflow-db.sh:/init-mlflow-db.sh
    command:
      - bash
      - -c
      - |
        chmod +x /init-optuna-db.sh
        /init-optuna-db.sh
        chmod +x /init-mlflow-db.sh
        /init-mlflow-db.sh
    env_file: ${PWD}/config/.env
    restart: "no"

  airflow-init:
    <<: *airflow-common
    entrypoint: >
      bash -c "
      airflow db migrate
      "
    depends_on:
      postgres:
        condition: service_healthy
      optuna-init:
        condition: service_completed_successfully
    restart: "no"

  redis:
    image: redis:7

  airflow-webserver:
    <<: *airflow-common
    ports:
      - "8080:8080"
    command: airflow api-server
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      optuna-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      optuna-init:
        condition: service_completed_successfully

  airflow-trigerrer:
    <<: *airflow-common
    command: airflow triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      optuna-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: airflow dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      optuna-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: airflow celery worker --concurrency=5
    hostname: airflow-worker
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      optuna-init:
        condition: service_completed_successfully

  airflow-flower:
    <<: *airflow-common
    ports:
      - "5556:5555"
    command: airflow celery flower
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      optuna-init:
        condition: service_completed_successfully
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

volumes:
  postgres-db-volume:
  # mlflow-artifacts:
