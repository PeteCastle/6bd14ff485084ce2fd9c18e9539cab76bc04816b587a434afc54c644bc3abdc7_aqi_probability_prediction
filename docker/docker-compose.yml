---
x-airflow-common:
  &airflow-common
  build:
    context: ${PWD}          # project root
    dockerfile: docker/airflow.Dockerfile
  env_file: ${PWD}/config/.env
  volumes:
    - ${PWD}/airflow/logs:/opt/airflow/logs
    - ${PWD}/models:/opt/airflow/models
    - ${PWD}/cache:/opt/airflow/cache
    - ${PWD}/airflow/dags:/opt/airflow/dags
    - ${PWD}/src:/opt/airflow/src
    - ${PWD}/reports:/opt/airflow/reports
    - ${PWD}/config/airflow.cfg:/opt/airflow/airflow.cfg
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    - redis
    - postgres

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

  optuna-init:
    image: postgres:13
    depends_on:
      - postgres
    volumes:
      - ${PWD}/scripts/init-optuna-db.sh:/init-optuna-db.sh
    command: ["bash", "-c", "chmod +x /init-optuna-db.sh && /init-optuna-db.sh"]
    env_file: ${PWD}/config/.env

  airflow-init:
    <<: *airflow-common
    command: >
      airflow db migrate

  redis:
    image: redis:7

  airflow-webserver:
    <<: *airflow-common
    ports:
      - "8080:8080"
    command: airflow api-server
    depends_on:
      - airflow-init
      - optuna-init

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      - airflow-init
      - optuna-init

  airflow-trigerrer:
    <<: *airflow-common
    command: airflow triggerer
    depends_on:
      - airflow-init
      - optuna-init

  airflow-dag-processor:
    <<: *airflow-common
    command: airflow dag-processor
    depends_on:
      - airflow-init
      - optuna-init

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    hostname: airflow-worker
    depends_on:
      - airflow-init
      - optuna-init

  airflow-flower:
    <<: *airflow-common
    ports:
      - "5555:5555"
    command: celery flower
    depends_on:
      - airflow-init
      - optuna-init

volumes:
  postgres-db-volume:
