x-airflow-common:
  &airflow-common
  build:
    context: ${PWD}          # project root
    dockerfile: airflow/Dockerfile
  environment:
    AIRFLOW__API__BASE_URL: http://airflow-webserver:8080
    AIRFLOW__API_AUTH__JWT_SECRET : mysecretdasfa31dsfa
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    # AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
    AIRFLOW__CELERY__RESULT_BACKEND: redis://redis:6379/1
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__API__SECRET_KEY: mysecretkey
    OPTUNA_DATABASE_URL: postgresql://airflow:airflow@postgres/optuna
    PYTHONPATH: /opt/airflow
  volumes:
    - ${PWD}/airflow/logs:/opt/airflow/logs
    - ${PWD}/models:/opt/airflow/models
    - ${PWD}/cache:/opt/airflow/cache
    - ${PWD}/airflow/dags:/opt/airflow/dags
    - ${PWD}/src:/opt/airflow/src
    - ${PWD}/reports:/opt/airflow/reports
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    - redis
    - postgres

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

  optuna-init:
    image: postgres:13
    depends_on:
      - postgres
    entrypoint: >
      bash -c "
      until pg_isready -h postgres -U airflow; do sleep 1; done;
      psql -h postgres -U airflow -tc \"SELECT 1 FROM pg_database WHERE datname = 'optuna'\" | grep -q 1 || psql -h postgres -U airflow -c 'CREATE DATABASE optuna';
      "

    environment:
      PGPASSWORD: airflow

  airflow-init:
    <<: *airflow-common
    entrypoint: >
      bash -c "
      airflow db migrate
      "


  redis:
    image: redis:7

  airflow-webserver:
    <<: *airflow-common
    ports:
      - "8080:8080"
    command: airflow api-server
    depends_on:
      - airflow-init
      - optuna-init

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      - airflow-init
      - optuna-init
  
  airflow-trigerrer:
    <<: *airflow-common
    command: airflow triggerer
    depends_on:
      - airflow-init
      - optuna-init
  
  airflow-dag-processor:
    <<: *airflow-common
    command: airflow dag-processor
    depends_on:
      - airflow-init
      - optuna-init

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    hostname: airflow-worker
    depends_on:
      - airflow-init
      - optuna-init

  airflow-flower:
    <<: *airflow-common
    ports:
      - "5555:5555"
    command: celery flower
    depends_on:
      - airflow-init
      - optuna-init

volumes:
  postgres-db-volume: