name: CI

on:
  push:
    branches: [ main, final-project ]
  pull_request:
    branches: [ main, final-project ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.9'

      - name: Install uv
        run: pip install uv

      - name: Create venv with uv
        run: uv venv

      - name: Install dependencies (CPU only)
        run: .venv/bin/uv pip install '.[cpu]'

      - name: Run pytest
        run: |
          .venv/bin/pytest -q tests/ --junitxml=test-results/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-3.10.9
          path: test-results/junit.xml
          if-no-files-found: warn